[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lambda_tasks"]

[project]
name = "django-lambda-tasks"
version = "0.7.0"
description = "Run async tasks in a lambda function"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "django",
    "pydantic",
    "redis",
    "awslambdaric",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pre-commit",
    "pytest",
    "pytest-django",
    "pytest-mock",
    "pytest-randomly",
    "pytest-xdist",
    "pytest-cov",
    "ty",
    "psycopg",
]

[tool.ty.rules]
all = "error"

[tool.ty.src]
exclude = ["tests", "example"]

[tool.pytest.ini_options]
addopts = "-n auto --randomly-seed=last"
python_files = ["tests/test_*.py"]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.isort]
profile = "black"
